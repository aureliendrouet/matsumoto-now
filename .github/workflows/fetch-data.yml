name: Fetch city data

on:
  schedule:
    # Every 30 minutes. City feeds and the Anshin-net archive have no CORS
    # headers, so this job fetches them into public/data/alerts.json.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch feeds
        env:
          # Optional: add a DeepL API key (free tier) as a repository secret to
          # get English translations of alert titles.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/fetch-city-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/alerts.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/alerts.json
          git commit -m "data: refresh city alerts"
          git push
