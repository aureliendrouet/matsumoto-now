name: Fetch city data

on:
  schedule:
    # Every 30 minutes. City feeds and the Anshin-net archive have no CORS
    # headers, so this job fetches them into public/data/alerts.json.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the deploy workflow after committing new data

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch feeds
        env:
          # Optional: add a DeepL API key (free tier) as a repository secret to
          # get English translations of alert titles.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/fetch-city-data.mjs

      # Measured air quality (Soramame) — only while the feature is enabled,
      # so the site doesn't redeploy hourly for data it never shows.
      - name: Fetch measured air quality
        run: |
          if grep -q 'measuredAir: true' src/features.ts; then
            node scripts/fetch-air-data.mjs
          else
            echo "measuredAir is off — skipping."
          fi

      # Fire incidents, 119 dispatch counters and the wildfire advisory — only
      # while the feature is enabled, since 松本広域消防局 has not yet confirmed
      # republication (see the note in scripts/fetch-fire-data.mjs).
      - name: Fetch fire information
        run: |
          if grep -q 'fireLiveData: true' src/features.ts; then
            node scripts/fetch-fire-data.mjs
          else
            echo "fireLiveData is off — skipping."
          fi

      # Heat index & 熱中症警戒アラート (環境省). Seasonal: outside 22 Apr - 21 Oct
      # the endpoints 404 and the script writes season:false, which the card
      # renders as an off-season note rather than an error.
      - name: Fetch heat index
        run: |
          if grep -q 'heatIndex: true' src/features.ts; then
            node scripts/fetch-heat-data.mjs
          else
            echo "heatIndex is off - skipping."
          fi

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/data/; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "data: refresh city alerts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger `on: push` workflows
      # (anti-recursion rule), so kick the deploy explicitly.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
