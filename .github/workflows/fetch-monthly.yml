name: Fetch monthly data

on:
  schedule:
    # Slow-moving open data: police crime CSVs (yearly, ~June), GTFS bus feeds
    # (a few revisions per year), shelter/AED designations (rare).
    - cron: '23 3 5 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the deploy workflow after committing new data

concurrency:
  group: fetch-monthly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # fetch-bus-data.mjs needs fflate to read the GTFS zip
      - run: npm ci

      - name: Fetch crime, bus and shelter data
        run: |
          node scripts/fetch-crime-data.mjs
          node scripts/fetch-bus-data.mjs
          node scripts/fetch-shelter-data.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/data/; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "data: refresh monthly open data (crime, bus, shelters)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger `on: push` workflows
      # (anti-recursion rule), so kick the deploy explicitly.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
