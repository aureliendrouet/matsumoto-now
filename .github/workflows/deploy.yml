name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Determine base path
        id: pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_PAGES_REPO: ${{ github.repository_owner }}.github.io
        run: |
          # A repo named "<owner>.github.io" is GitHub's special user/org
          # Pages site and always deploys to the domain root, never to a
          # "/<repo-name>" subpath.
          if [ "$REPO_NAME" = "$OWNER_PAGES_REPO" ]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          # Site and base path are derived from the repository, so this works
          # on any fork without editing astro.config.mjs.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
